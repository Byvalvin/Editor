<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Welcome to ed379</h1>
    <div id="output"></div>
    <div class="button-container">
        <button onclick="showInput('a')">Add Text</button>
        <button onclick="showInput('d')">Delete Line</button>
        <button onclick="showInput('i')">Insert Text</button>
        <button onclick="showInput('l')">Load File</button>
        <button onclick="showInput('p')">Print Line</button>
        <button onclick="showInput('r')">Replace Text</button>
        <button onclick="showInput('s')">Sort Lines</button>
        <button onclick="showInput('w')">Save File</button>
        <button onclick="showInput('/')">Search Forward</button>
        <button onclick="showInput('?')">Search Backward</button>
        <button onclick="quit()">Quit</button>
    </div>
    <div id="input-section" class="input-section"></div>
    <script src="editor.js"></script>
</body>
</html>
