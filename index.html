<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="commandList">
        <button onclick="setCommand('p')">Print</button>
        <button onclick="setCommand('a')">Add Line</button>
        <button onclick="setCommand('d')">Delete Line</button>
        <button onclick="setCommand('i')">Insert Line</button>
        <button onclick="setCommand('l')">Load File</button>
        <button onclick="setCommand('r')">Replace Text</button>
        <button onclick="setCommand('s')">Sort Lines</button>
        <button onclick="setCommand('w')">Save File</button>
        <button onclick="setCommand('q')">Quit</button>
    </div>
    <div id="content">
        <div id="inputArea">
            <input type="text" id="commandInput" placeholder="Enter command" autofocus />
            <button onclick="processCommand()">Submit</button>
            <input type="file" id="fileInput" />
        </div>
        <div id="textArea" contenteditable="true"></div>
    </div>
    <script src="scripts/ed.js"></script>
</body>
</html>
