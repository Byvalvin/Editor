<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Welcome to ed379</h1>
    <div id="output"></div>
    <div class="button-container">
        <button id="btn-a" onclick="selectCommand('a')">Add Text</button>
        <button id="btn-d" onclick="selectCommand('d')">Delete Line</button>
        <button id="btn-i" onclick="selectCommand('i')">Insert Text</button>
        <button id="btn-l" onclick="selectCommand('l')">Load File</button>
        <button id="btn-p" onclick="selectCommand('p')">Print Line/Range</button>
        <button id="btn-r" onclick="selectCommand('r')">Replace Text</button>
        <button id="btn-s" onclick="selectCommand('s')">Sort Lines</button>
        <button id="btn-w" onclick="selectCommand('w')">Save File</button>
        <button id="btn-/" onclick="selectCommand('/')">Search Forward</button>
        <button id="btn-?" onclick="selectCommand('?')">Search Backward</button>
        <button onclick="quit()">Quit</button>
    </div>
    <div id="input-section" class="input-section"></div>
    <script src="scripts/ed.js"></script>
</body>
</html>
